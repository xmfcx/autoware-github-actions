name: clang-tidy-before-after

on:
  workflow_dispatch:

jobs:
  evidence:
    name: ${{ matrix.distro }} / ${{ matrix.scenario.name }}
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        scenario:
          - name: before-root
            revision: 14a021944448062faaaf5b3b4d8255b899a7c94d
            layout: root
            explicit: false
            supported: true
          - name: after-root
            revision: 5b5c3905729c70c82188f00a191e47fe7315bdba
            layout: root
            explicit: false
            supported: true
          - name: before-nested
            revision: 14a021944448062faaaf5b3b4d8255b899a7c94d
            layout: nested
            explicit: false
            supported: false
          - name: after-nested-default
            revision: 5b5c3905729c70c82188f00a191e47fe7315bdba
            layout: nested
            explicit: false
            supported: false
          - name: after-nested
            revision: 5b5c3905729c70c82188f00a191e47fe7315bdba
            layout: nested
            explicit: true
            supported: true
    env:
      EVIDENCE_CASE: ${{ matrix.scenario.name }}
      ACTION_REVISION: ${{ matrix.scenario.revision }}
      EVIDENCE_DISTRO: ${{ matrix.distro }}
      EXPLICIT_SOURCE: ${{ matrix.scenario.explicit }}
      SOURCE_DIRECTORY: ${{ matrix.scenario.layout == 'root' && '.' || 'src/clang_tidy_fixture' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the exact action revision
        uses: actions/checkout@v7
        with:
          repository: ${{ startsWith(matrix.scenario.name, 'before-') && 'autowarefoundation/autoware-github-actions' || 'xmfcx/autoware-github-actions' }}
          ref: ${{ matrix.scenario.revision }}
          path: .action-under-test
          sparse-checkout: clang-tidy

      - name: Prepare a package at the checkout root
        id: fixture
        run: |
          bash tests/prepare-clang-tidy-source-directory.sh
          mv "$SOURCE_DIRECTORY/fixture_package/"* "$SOURCE_DIRECTORY/"
          rmdir "$SOURCE_DIRECTORY/fixture_package"
          printf './checks/ignored.cpp\n*/wildcard_ignored.cpp\n' > "$SOURCE_DIRECTORY/.clang-tidy-ignore"
          echo "config-url=file://${RUNNER_TEMP}/source-directory-clang-tidy.yaml" >> "$GITHUB_OUTPUT"

      - name: Run the action with source-directory omitted
        id: default
        if: ${{ !matrix.scenario.explicit }}
        continue-on-error: ${{ !matrix.scenario.supported }}
        uses: ./.action-under-test/clang-tidy
        with:
          rosdistro: ${{ matrix.distro }}
          target-packages: clang_tidy_source_fixture
          clang-tidy-config-url: ${{ steps.fixture.outputs.config-url }}
          cache-key-element: before-after-${{ github.run_id }}-${{ matrix.scenario.name }}
          artifact-name: positive-${{ matrix.distro }}-${{ matrix.scenario.name }}

      - name: Run the action with source-directory set
        id: source
        if: matrix.scenario.explicit
        uses: ./.action-under-test/clang-tidy
        with:
          rosdistro: ${{ matrix.distro }}
          source-directory: ${{ env.SOURCE_DIRECTORY }}
          target-packages: clang_tidy_source_fixture
          clang-tidy-config-url: ${{ steps.fixture.outputs.config-url }}
          cache-key-element: before-after-${{ github.run_id }}-${{ matrix.scenario.name }}
          artifact-name: positive-${{ matrix.distro }}-${{ matrix.scenario.name }}

      - name: Capture and verify positive or unsupported-layout evidence
        if: always()
        env:
          ACTION_OUTCOME: ${{ matrix.scenario.explicit && steps.source.outcome || steps.default.outcome }}
          LEGACY_CONFIG_HASH: ${{ hashFiles('.clang-tidy') }}
          SELECTED_CONFIG_HASH: ${{ hashFiles(format('{0}/.clang-tidy', env.SOURCE_DIRECTORY)) }}
        run: python3 tests/clang-tidy-evidence.py capture positive

      - name: Introduce a lint violation
        if: matrix.scenario.supported
        run: |
          printf 'int *checked = 0;\n' > "$SOURCE_DIRECTORY/checks/checked.cpp"
          rm -rf /tmp/clang-tidy-result

      - name: Reject the violation with source-directory omitted
        id: negative-default
        if: ${{ matrix.scenario.supported && !matrix.scenario.explicit }}
        continue-on-error: true
        uses: ./.action-under-test/clang-tidy
        with:
          rosdistro: ${{ matrix.distro }}
          target-packages: clang_tidy_source_fixture
          target-files: ./checks/checked.cpp ./checks/ignored.cpp ./checks/wildcard_ignored.cpp ./checks/test/ignored_test.cpp
          clang-tidy-config-url: ${{ steps.fixture.outputs.config-url }}
          cache-key-element: before-after-${{ github.run_id }}-${{ matrix.scenario.name }}
          artifact-name: negative-${{ matrix.distro }}-${{ matrix.scenario.name }}

      - name: Reject the violation with source-directory set
        id: negative-source
        if: matrix.scenario.explicit
        continue-on-error: true
        uses: ./.action-under-test/clang-tidy
        with:
          rosdistro: ${{ matrix.distro }}
          source-directory: ${{ env.SOURCE_DIRECTORY }}
          target-packages: clang_tidy_source_fixture
          target-files: ./checks/checked.cpp ./checks/ignored.cpp ./checks/wildcard_ignored.cpp ./checks/test/ignored_test.cpp
          clang-tidy-config-url: ${{ steps.fixture.outputs.config-url }}
          cache-key-element: before-after-${{ github.run_id }}-${{ matrix.scenario.name }}
          artifact-name: negative-${{ matrix.distro }}-${{ matrix.scenario.name }}

      - name: Capture and verify the action rejects the violation
        if: ${{ always() && matrix.scenario.supported }}
        env:
          ACTION_OUTCOME: ${{ matrix.scenario.explicit && steps.negative-source.outcome || steps.negative-default.outcome }}
          LEGACY_CONFIG_HASH: ${{ hashFiles('.clang-tidy') }}
          SELECTED_CONFIG_HASH: ${{ hashFiles(format('{0}/.clang-tidy', env.SOURCE_DIRECTORY)) }}
        run: python3 tests/clang-tidy-evidence.py capture negative

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: before-after-${{ matrix.distro }}-${{ matrix.scenario.name }}
          path: evidence/

  compare:
    name: Compare upstream and candidate behavior
    needs: evidence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: before-after-*
          path: evidence-results
      - name: Require equivalent default behavior and working nested sources
        run: python3 tests/clang-tidy-evidence.py compare evidence-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: before-after-summary
          path: evidence-results/summary.*
